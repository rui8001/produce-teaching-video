name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Validate public Skill package
        run: python scripts/validate_repository.py

      - name: Run deterministic Git teaching demonstration
        run: bash examples/git-merge-conflict/demo.sh

      - name: Test Git demonstration isolation
        run: python -m unittest discover -s tests -v
